[package]
name = "utils"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
regex = "1.11"
reqwest = { version = "0.12", features = ["gzip", "json", "rustls-tls"], default-features = false }
serde = "1.0"
serde_json = "1.0"
serenity = { version = "0.12", features = ["client", "voice", "cache", "collector"] }
tokio = { version = "1.45", features = ["rt-multi-thread", "macros", "process"] }
tokio-stream = { version = "0.1", features = ["io-util"] }
tracing = "0.1"
