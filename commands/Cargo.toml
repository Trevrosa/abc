[package]
name = "commands"
version = "0.1.0"
edition = "2024"

[dependencies]
serenity = { version = "0.12", features = ["client", "voice", "cache", "collector"] }
songbird = { version = "0.5", features = ["driver", "receive"] }
inventory = "0.3"
tracing = "0.1"
tokio = "1.45"
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
bytes = "1.10"

utils = { path = "../utils" }
glue = { path = "../glue" }
macro_cmd = { path = "../macros/command" }