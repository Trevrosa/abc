[package]
name = "abc"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.102"
base64 = "0.22.1"
# TODO: switch to alternative, bincode unmaintained
bincode = { version = "2.0.1", features = ["serde"] }
bytes = "1.11.1"
chrono = { version = "0.4.44", features = ["serde"] }
ctrlc = { version = "3.5.2", features = ["termination"] }
hex = "0.4.3"
regex = "1.12.3"
reqwest = { version = "0.13.3", features = ["gzip", "json", "form", "query"] }
rustls = "0.23.40"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
serenity = { version = "0.12.5", features = ["client", "voice", "cache", "collector"] }
sha1 = "0.11.0"
songbird = { version = "0.6.0", features = ["builtin-queue", "driver", "receive"] }
# TODO: update to 0.6 once its fixed
symphonia = { version = "0.5.5", features = ["all", "opt-simd"] }
thiserror = "2.0.18"
tokio = { version = "1.52.3", features = ["rt-multi-thread", "macros"] }
tokio-stream = { version = "0.1.18", features = ["io-util"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[target.'cfg(target_env = "msvc")'.dependencies]
mimalloc = "0.1.50"

[target.'cfg(not(target_env = "msvc"))'.dependencies]
tikv-jemallocator = "0.6.1"

[profile.release]
lto = "fat"
panic = "abort"
codegen-units = 1
strip = true
