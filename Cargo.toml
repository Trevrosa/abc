[package]
name = "abc"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0.100"
# TODO: switch to alternative, bincode unmaintained
bincode = { version = "2.0.1", features = ["serde"] }
bytes = "1.11.0"
chrono = { version = "0.4.42", features = ["serde"] }
ctrlc = { version = "3.5.1", features = ["termination"] }
regex = "1.12.2"
reqwest = { version = "0.13.1", features = ["gzip", "json", "form", "query"], default-features = false }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
serenity = { version = "0.12.5", features = ["client", "voice", "cache", "collector"] }
songbird = { version = "0.5.0", features = ["driver", "receive"] }
symphonia = { version = "0.5.5", features = ["all", "opt-simd"] }
thiserror = "2.0.17"
tokio = { version = "1.49.0", features = ["rt-multi-thread", "macros"] }
tokio-stream = { version = "0.1.18", features = ["io-util"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.22"

[target.'cfg(target_env = "msvc")'.dependencies]
mimalloc = "0.1.48"

[target.'cfg(not(target_env = "msvc"))'.dependencies]
tikv-jemallocator = "0.6.1"

[profile.release]
lto = "fat"
panic = "abort"
codegen-units = 1
strip = true
